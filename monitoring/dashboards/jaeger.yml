# monitoring/dashboards/jaeger.yml

# This file serves as a reference for configuring a Jaeger deployment.
# In a typical Docker or Kubernetes setup, these settings would be passed as
# command-line arguments or environment variables.

# For example, when running the jaeger-all-in-one Docker container, you can
# pass these settings as environment variables.
#
# Example Docker run command:
# docker run -d --name jaeger \
#   -e COLLECTOR_ZIPKIN_HOST_PORT=:9411 \
#   -e COLLECTOR_OTLP_ENABLED=true \
#   -p 6831:6831/udp \
#   -p 16686:16686 \
#   -p 14268:14268 \
#   jaegertracing/all-in-one:latest

# The configuration options below mirror the settings you would use.

# Collector service settings
collector:
  # Port for the gRPC collector (used by OpenTelemetry SDK)
  grpc:
    host-port: ":14250"
  # Port for the HTTP collector (used by Jaeger SDKs)
  http:
    host-port: ":14268"
  # Port for the Zipkin-compatible collector
  zipkin:
    host-port: ":9411"

# Query service settings (for the Jaeger UI)
query:
  # Port for the main Jaeger UI and API
  host-port: ":16686"
  # Base path for the UI
  base-path: "/"

# Agent settings (for receiving spans from applications)
agent:
  # The agent listens on this host and port for spans from Jaeger clients
  servers:
    - host-port: "localhost:6831"

# Log level for Jaeger components (e.g., info, debug, error)
log-level: info

# Storage backend configuration (default is in-memory)
# For production, use a persistent storage backend like Elasticsearch or Cassandra.
# storage:
#   type: elasticsearch
#   options:
#     es:
#       servers:
#         - http://elasticsearch:9200
#       index-prefix: jaeger
#       username: "elastic"
#       password: "changeme"
