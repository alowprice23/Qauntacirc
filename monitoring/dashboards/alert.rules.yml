groups:
- name: quantum_system_alerts
  rules:
  - alert: HighQuantumEnergyLevel
    expr: quantum_energy_level > 100
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High quantum energy detected (instance {{ $labels.instance }})"
      description: "The energy level for qubit {{ $labels.qubit_id }} on system {{ $labels.system_id }} has exceeded the threshold of 100."

  - alert: AgentPerformanceDegradation
    expr: histogram_quantile(0.95, sum(rate(agent_execution_time_seconds_bucket[5m])) by (le, agent_name)) > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Agent {{ $labels.agent_name }} is performing slowly"
      description: "The 95th percentile of execution time for agent {{ $labels.agent_name }} is over 5 seconds."

  - alert: LowAgentSuccessRate
    expr: (sum(rate(agent_operations_total{status="success"}[5m])) by (agent_name) / sum(rate(agent_operations_total[5m])) by (agent_name)) < 0.90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Low success rate for agent {{ $labels.agent_name }}"
      description: "The success rate for agent {{ $labels.agent_name }} has dropped below 90% over the last 10 minutes."

  - alert: LyapunovExponentAnomalous
    expr: abs(quantum_lyapunov_exponent) > 2.5
    for: 2m
    labels:
      severity: page
    annotations:
      summary: "Quantum system stability is anomalous ({{ $labels.system_id }})"
      description: "The Lyapunov exponent for system {{ $labels.system_id }} is {{ $value }}, indicating potential instability."
