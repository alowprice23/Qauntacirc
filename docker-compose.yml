version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js"

  orchestrator:
    build: .
    command: python run_orchestrator.py
    volumes:
      - .:/app
    depends_on:
      - nats
    environment:
      - PYTHONUNBUFFERED=1

  planck_forge:
    build: .
    command: python agents/planck_forge/agent.py
    volumes:
      - .:/app
    depends_on:
      - nats
      - orchestrator
    environment:
      - PYTHONUNBUFFERED=1

  schrodinger_dev:
    build: .
    command: python agents/schrodinger_dev/agent.py
    volumes:
      - .:/app
    depends_on:
