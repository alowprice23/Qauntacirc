[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantacirc"
version = "0.1.0"
authors = [
  { name="Jules", email="jules@example.com" },
]
description = "A quantum circuit simulation and analysis tool"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pydantic",
    "rich",
    "networkx",
    "hypothesis",
]

[project.urls]
"Homepage" = "https://github.com/example/quantacirc"
"Bug Tracker" = "https://github.com/example/quantacirc/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
